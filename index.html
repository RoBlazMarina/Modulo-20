<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Home screen -->
    <div id="home-screen" class="screen">
        <h1>Pomodoro Technique</h1>
        <button onclick="startStudy()">Study (25 min)</button>
        <button onclick="startBreak()">Break (5 min)</button>
        <button onclick="showSubscription()">Change timer</button>
    </div>

    <!-- Timer screen -->
    <div id="timer-screen" class="screen hidden">
        <h1 id="timer-title"></h1>
        <div id="time">00:00</div>

        <button id="pause-button" onclick="pauseRestart()">Pause</button>
        <button onclick="restart()">Restart</button>
        <button onclick="goToHome()">Back</button>
    </div>

    <!-- Subscription screen -->
    <div id="subscription-screen" class="screen hidden">
        <h2>To change the timer you need to ✨𝓈𝓊𝓈𝒸𝓇𝒾𝒷𝑒✨</h2>
        <button onclick="startMaze()">Subscribe</button>
        <button onclick="goToHome()">Back</button>
    </div>

    <!-- Maze screen -->
    <div id="maze-screen" class="screen hidden">
        <h2>Reach the exit and you'll subscribe! <br>
            ☆ﾐ(o*･ω･)ﾉ</h2>
        <p class="subtext">and prove you really want to subscribe :P</p>
        <canvas id="maze-canvas" width="300" height="300"></canvas>
        <button onclick="goToHome()">Back</button>
    </div>

    <!-- Cat screen -->
    <div id="cat-screen" class="screen hidden">
        <h2>|ハ｀∀´ﾉ Muhahaha</h2>
        <img src="assets/bingus-cat.gif" alt="Bingus Cat">
        <div>
            <button onclick="goToHome()">Back</button>
        </div>
    </div>

    <audio id="alarm" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
