<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla inicial -->
    <div id="pantalla-inicio" class="pantalla">
        <h1>Pomodoro</h1>
        <button onclick="iniciarEstudio()">Estudiar (25 min)</button>
        <button onclick="iniciarDescanso()">Descanso (5 min)</button>
        <button onclick="mostrarSuscripcion()">Cambiar tiempos</button>
    </div>

    <!-- Pantalla temporizador -->
    <div id="pantalla-temporizador" class="pantalla oculto">
        <h1 id="titulo-temporizador"></h1>
        <div id="tiempo">00:00</div>

        <button id="btn-pausa" onclick="pausarReanudar()">Pausar</button>
        <button onclick="reiniciar()">Reiniciar</button>
        <button onclick="volverInicio()">Volver</button>
    </div>

    <!-- Pantalla suscripción -->
    <div id="pantalla-suscripcion" class="pantalla oculto">
        <h2>Para cambiar los tiempos necesitas ✨𝓈𝓊𝓈𝒸𝓇𝒾𝒷𝒾𝓇𝓉𝑒✨</h2>
        <button onclick="iniciarLaberinto()">Suscribirse</button>
        <button onclick="volverInicio()">Volver</button>
    </div>

    <!-- Pantalla del laberinto -->
    <div id="pantalla-laberinto" class="pantalla oculto">
        <h2>Alcanza la salida y podrás suscribirte! <br>
            ☆ﾐ(o*･ω･)ﾉ</h2>
        <p class="subtexto">y demostrar que de verdad quieres suscribirte (y que eres humano)</p>
        <canvas id="laberinto-canvas" width="300" height="300"></canvas>
        <button onclick="volverInicio()">Volver</button>
    </div>

    <!-- Pantalla de gif -->
    <div id="pantalla-gato" class="pantalla oculto">
        <h2>|ハ｀∀´ﾉ Muhahaha</h2>
        <img src="assets/bingus-cat.gif" alt="Bingus Cat">
        <div>
            <button onclick="volverInicio()">Volver</button>
        </div>
    </div>

    <audio id="alarma" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
